name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # jsdom 30 requires ^22.22.2 || ^24.15.0 || >=26.0.0, and the undici 8
          # it pulls in calls webidl APIs that do not exist on Node 20.
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
