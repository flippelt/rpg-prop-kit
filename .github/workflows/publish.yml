name: publish

# Publica no npm ao empurrar uma tag v* (ex.: git tag v0.2.0 && git push origin v0.2.0)
# ou via workflow_dispatch (republica a versão do package.json na main).
#
# Autentica via OIDC — sem NPM_TOKEN, sem OTP.
# Configuração única no npmjs.com (Package → Trusted Publisher):
#   Organization or user:  flippelt
#   Repository:            rpg-prop-kit
#   Workflow filename:     publish.yml
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      - run: npm publish --access public --provenance
